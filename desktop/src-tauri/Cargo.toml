[package]
name = "soundcloud-desktop"
version = "8.4.16"
description = "Sonora  Ea beautiful music desktop app"
authors = ["zxcloli666"]
edition = "2024"

[lib]
name = "soundcloud_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
# Пин на версE�сEветки feat/cef  EинасE� cargo берёсEболее сE�ежусEcrates.io (без сE�сE� cef).
tauri-build = { version = "=2.6.2", features = [] }

[dependencies]
tauri = { version = "=2.11.2", features = ["macos-private-api", "devtools", "tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-fs = "2.5.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "fs", "time", "process"] }
warp = "0.3"
discord-rich-presence = "1"
tauri-plugin-http = "2.5.7"
base64 = "0.22"
sha2 = "0.10"
hex = "0.4"
sc-fingerprint = { git = "https://github.com/zxcloli666/SoundCloud-Backend", tag = "v8.5.8" }
wreq = { version = "5", features = ["json", "stream", "gzip", "brotli", "socks"] }
futures-util = "0.3"
http = "1"
urlencoding = "2"
tauri-plugin-single-instance = "2.4.0"
rodio = { version = "0.22.2", features = ["mp3", "symphonia-aac", "symphonia-isomp4", "symphonia-ogg"] }
cpal = "0.17"
biquad = "0.5"
rustfft = { version = "6", default-features = false }
souvlaki = "0.8"
raw-window-handle = "0.6"
tauri-plugin-dialog = "2.7.0"
tauri-plugin-updater = "2"
# Installed as the process-default TLS provider at startup (see lib.rs):
# reqwest 0.13 is built with `rustls-no-provider` in this dependency graph
# and panics if a TLS client is created before a provider is installed.
rustls = { version = "0.23", default-features = false, features = ["ring"] }
ogg = "0.9.2"
audiopus = "0.2.0"
chrono = { version = "0.4", features = ["clock"] }
libc = "0.2"
url = "2"
regex = { version = "1", default-features = false, features = ["std"] }
bytes = "1"
call-client = { path = "../../utils/call/client" }
decrypt-client = { path = "../../utils/decrypt-client" }
tracing = "0.1"
ffmpeg-sidecar = "2.5.2"
if-addrs = "0.15"
uuid = { version = "1", features = ["v4"] }

[features]
# Opt-in: рендер сE�рез CEF (Chromium) вмесE�о wry/webkitgtk. ТребуесE[patch.crates-io] ниже.
# ДесE�лтнасEсE�орка (без этой сE�сE�) осE�аётсE�Eна wry.
cef = ["tauri/cef"]

[profile.release]
lto = true

# ЭксE�ериментальнасEветка Tauri сEрантаймом tauri-runtime-cef и сE�сE�й `cef`.
# ПатсE�м ТОЛЬКЁE`tauri` (одна крейта на весE�EграсEↁEплагинсEсEcrates.io разделяюсE# тосEже рантайм) и `tauri-build` (насEbuild-dep, пин на версE�сEветки). Внутренние
# tauri-* (tauri-runtime/utils/macros/codegen/plugin) git-tauri тянесEпо path сE�м;
# отдельно исEНЁEпатсE�м  EинасE� build-script'сEcrates.io-плагинов ловясEskew
# версE�й schemars (tauri-plugin::global_scope_schema).
[patch.crates-io]
tauri = { git = "https://github.com/tauri-apps/tauri", branch = "feat/cef" }
tauri-build = { git = "https://github.com/tauri-apps/tauri", branch = "feat/cef" }

[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3.5", default-features = false, features = ["tokio"] }

# WebView2 memory control: COM interfaces (SetMemoryUsageTargetLevel) + the
# Win32 process snapshot used to trim idle WebView working sets.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
windows-core = "0.61"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
] }
