name: Release (Windows)

# Automated installer builds: push a version tag (`git tag v8.4.14 &&
# git push origin v8.4.14`) for a published GitHub Release with the signed
# NSIS setup + updater manifest (latest.json), or run manually from the
# Actions tab (artifacts only, no release). Needs the
# TAURI_SIGNING_PRIVATE_KEY[_PASSWORD] repo secrets.
# Bump the version in desktop/package.json, desktop/src-tauri/tauri.conf.json
# and desktop/src-tauri/Cargo.toml before tagging. Release notes are generated
# from the commit log since the previous tag.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
          key: sonora-windows

      - name: Install frontend dependencies
        working-directory: desktop
        run: pnpm install --frozen-lockfile

      - name: Generate changelog
        id: changelog
        shell: bash
        run: |
          prev_tag=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
          if [ -n "$prev_tag" ]; then
            range="$prev_tag..HEAD"
          else
            range="HEAD"
          fi
          body=$(git log --no-merges --pretty=format:'- %s (%h)' "$range" | grep -vE '^- (ci|chore|docs|test)' || true)
          if [ -z "$body" ]; then
            body="- Maintenance release."
          fi
          {
            echo 'body<<CHANGELOG_EOF'
            echo "$body"
            echo 'CHANGELOG_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the updater artifacts (.sig) and generates latest.json for
          # in-app updates. The build fails without these secrets.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: desktop
          # Only tag pushes publish a release; manual runs stay artifact-only.
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: 'Sonora ${{ github.ref_name }}'
          releaseBody: ${{ steps.changelog.outputs.body }}
          releaseDraft: false
          prerelease: false
          args: --bundles nsis

      - name: Collect portable exe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "desktop/src-tauri/target/release/bundle/portable"
          Copy-Item "desktop/src-tauri/target/release/soundcloud-desktop.exe" "desktop/src-tauri/target/release/bundle/portable/Sonora-portable.exe"

      - name: Upload portable exe
        uses: actions/upload-artifact@v4
        with:
          name: Sonora-portable-${{ github.ref_name }}-${{ github.sha }}
          path: desktop/src-tauri/target/release/bundle/portable/Sonora-portable.exe
